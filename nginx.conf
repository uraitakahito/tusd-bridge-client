server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # tusd-bridge HTTP API へのリバースプロキシ
    # 同一オリジンにすることで CORS の問題を回避している。
    # このパスを変更する場合は src/config.ts の filesApiBaseUrl も合わせて変更すること。
    location /api/ {
        proxy_pass http://host.docker.internal:8001/;
        proxy_http_version 1.1;

        # SSE 用: バッファリングを無効化し、イベントを即座に転送する
        proxy_buffering off;
        proxy_cache off;

        # SSE 用: タイムアウトを長めに設定（デフォルト60秒だと切断される）
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
